<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DigiFood</title>

    <link rel="stylesheet" href="style.css">

    <link
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    rel="stylesheet"
    />
</head>
<body>

<nav class="navbar">

    <div class="logo">
        DigiFood
    </div>

    <ul class="nav-links">

        <li><a href="#">Home</a></li>
        <li><a href="#">Menu</a></li>
        <li><a href="#">Offers</a></li>
        <li><a href="#">Contact</a></li>
        <li><a href="profile.html">Profile</a></li>

    </ul>
    <div class="theme-toggle">

    <i class="fa-solid fa-moon"></i>

    </div>
    <div class="cart">

    <i class="fa-solid fa-cart-shopping"></i>

    <span id="cart-count">
        0
    </span>

</div>

    <div class="menu-icon">
        <i class="fa-solid fa-bars"></i>
    </div>

</nav>

    <!-- HERO SECTION -->

    <section class="hero">

        <div class="hero-content">

            <h1>
                Delicious Food Delivered To Your Doorstep
            </h1>

            <p>
                Fast delivery • Fresh food • Best offers
            </p>

            <button class="hero-btn">
                Explore Menu
            </button>

        </div>

    </section>

    <!-- FOOD SECTION -->

    <section class="food-section">

        <h2>Popular Foods</h2>

        <div class="food-container">

            <div class="food-card">

                <img src="https://images.unsplash.com/photo-1568901346375-23c9450c58cd?q=80&w=1000" alt="Burger">

                <div class="food-top">

    <h3>Burger</h3>

    <i class="fa-regular fa-heart favorite-icon"></i>

</div>

                <div class="rating">

    <i class="fa-solid fa-star"></i>
    <i class="fa-solid fa-star"></i>
    <i class="fa-solid fa-star"></i>
    <i class="fa-solid fa-star"></i>
    <i class="fa-solid fa-star-half-stroke"></i>

    <span>
        4.0 (120 reviews)
    </span>

</div>

<p>₹199</p>

                <button>Add to Cart</button>

            </div>

            <div class="food-card">

                <img src="https://images.unsplash.com/photo-1601924582970-9238bcb495d9?q=80&w=1000" alt="Pizza">

                <h3>Pizza</h3>

                <p>₹299</p>

                <button>Add to Cart</button>

            </div>

            <div class="food-card">

                <img src="https://images.unsplash.com/photo-1565299624946-b28f40a0ae38?q=80&w=1000" alt="Pizza">

                <h3>Cheese Pizza</h3>

                <p>₹349</p>

                <button>Add to Cart</button>

            </div>

        </div>

    </section>
    <!-- CART SIDEBAR -->

<div class="cart-sidebar">

    <div class="cart-header">

        <h2>Your Cart</h2>

        <span class="close-cart">
            ✖
        </span>

    </div>

    <div class="cart-items">

</div>

<div class="cart-footer">

    <h3>
        Total: ₹<span id="total-price">0</span>
    </h3>
    <button id="checkout-btn">
    Checkout
</button>

</div>

</div>
    <script src="script.js"></script>

</body>
</html>
